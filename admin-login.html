<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - UMKM Desa Mlancu</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .login-box {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-luxury);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
    }
    .login-logo p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--fg);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
      color: var(--fg);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: var(--gold);
    }
    .login-btn {
      width: 100%;
      margin-top: 24px;
    }
    .error-message {
      background: rgba(226, 92, 92, 0.1);
      border: 1px solid rgba(226, 92, 92, 0.3);
      color: #ff6b6b;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      margin-top: 16px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .back-home {
      text-align: center;
      margin-top: 24px;
    }
    .back-home a {
      color: var(--gold);
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .back-home a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo"><span class="gold">UMKM</span> Desa Mlancu</div>
        <p>Dashboard Admin</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="admin@desamlancu.id" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
          <span id="btnText">Login</span>
          <span id="btnLoader" style="display: none;">Loading...</span>
        </button>

        <div class="error-message" id="errorMessage"></div>
      </form>

      <div class="back-home">
        <a href="index.html">← Kembali ke Website</a>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-helper.js"></script>
  
  <script>
    // Wait for supabase to initialize
    function waitForSupabase() {
      return new Promise((resolve) => {
        if (window.supabase) {
          resolve();
        } else {
          setTimeout(() => waitForSupabase().then(resolve), 100);
        }
      });
    }

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const errorMessage = document.getElementById('errorMessage');

    // Check if already logged in
    waitForSupabase().then(async () => {
      const { data: { session } } = await window.supabase.auth.getSession();
      if (session) {
        window.location.href = 'admin-dashboard.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Wait for supabase to be ready
      await waitForSupabase();

      // Check if supabase is configured
      if (!window.supabase) {
        showError('Supabase belum dikonfigurasi. Silakan setup config.js terlebih dahulu.');
        return;
      }

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Loading state
      loginBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline';
      errorMessage.classList.remove('show');

      try {
        const { data, error } = await window.supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) throw error;

        // Success - redirect to dashboard
        window.location.href = 'admin-dashboard.html';

      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || 'Login gagal. Periksa email dan password Anda.');
        
        // Reset button
        loginBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }
  </script>
</body>
</html>
